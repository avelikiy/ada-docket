name: daily

# Reads new federal ADA Title III filings, commits them, and republishes the
# site to the gh-pages branch. No dependencies to install: the scripts are
# standard-library only.
#
# Pages is served from the gh-pages branch rather than an Actions artifact.
# Branch-based publishing runs on GitHub's own builder, so the site keeps
# updating from a manual `make publish` even when Actions itself is unavailable.

on:
  schedule:
    # 11:20 UTC — after the overnight PACER-to-RECAP indexing settles, and off
    # the hour, where GitHub's shared scheduler queues are longest.
    - cron: "20 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://avelikiy.github.io/ada-docket
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub disables a scheduled workflow after 60 days without repository
      # activity, and a commit pushed with GITHUB_TOKEN is not a reliable way to
      # reset that clock. A silently stopped timer is the worst failure this
      # project has — the site would keep serving stale filings under a promise
      # of daily updates — so the run re-enables its own schedule every day.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/enable" \
            --silent || echo "could not re-enable schedule; check Actions settings"

      - name: Fetch new filings
        run: python3 scripts/fetch.py --days 10

      - name: Commit the record
        run: |
          git config user.name  "ada-docket bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no new filings today"
          else
            git commit -m "data: filings through $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Build the site
        run: python3 scripts/build.py

      - name: Publish to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name  "ada-docket bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: build $(date -u +%Y-%m-%d)"
          git push -q -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
