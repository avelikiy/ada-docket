name: daily

# Reads yesterday's federal ADA Title III filings, commits any new ones, and
# republishes the site. No dependencies to install: the scripts are stdlib-only.

on:
  schedule:
    # 11:20 UTC — after the overnight PACER-to-RECAP indexing settles, and off
    # the hour, where GitHub's shared scheduler queues are longest.
    - cron: "20 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub disables a scheduled workflow after 60 days without repository
      # activity, and a commit pushed with GITHUB_TOKEN is not a reliable way to
      # reset that clock. A silently stopped timer is the worst failure this
      # project has — the site would keep serving stale filings under a promise
      # of daily updates — so the run re-enables its own schedule every day.
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/enable" \
            --silent || echo "could not re-enable schedule; check Actions settings"

      - name: Fetch new filings
        run: python3 scripts/fetch.py --days 10

      - name: Commit the record
        run: |
          git config user.name  "ada-docket bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no new filings today"
          else
            git commit -m "data: filings through $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
